<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valorant Mobile – Settings (English)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#120a22;--panel:#241a3d;--panel2:#2f2350;--line:#43366b;--tx:#f1ecfb;--dim:#a99fc4;--acc:#ff4655;--teal:#4fd1c5;--btn:#efe9de;--btnt:#111}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe9f9;--panel:#fff;--panel2:#e6def5;--line:#c9bde6;--tx:#1d1433;--dim:#6a5f87;--btn:#2a1d4d;--btnt:#fff}}
:root[data-theme="light"]{--bg:#efe9f9;--panel:#fff;--panel2:#e6def5;--line:#c9bde6;--tx:#1d1433;--dim:#6a5f87;--btn:#2a1d4d;--btnt:#fff}
:root[data-theme="dark"]{color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:auto}
header{display:flex;align-items:center;gap:8px;padding:8px 12px}
header h1{font-size:18px;margin:0;font-weight:600;flex:1;color:var(--dim)}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
button.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
#body{flex:1;display:flex;min-height:0}
nav{width:120px;flex:none;border-right:1px solid var(--line);overflow:auto}
nav div{padding:14px 8px;text-align:center;cursor:pointer;color:var(--dim)}
nav div.on{background:linear-gradient(90deg,var(--acc),#7a1d3a);color:#fff;font-weight:600}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;overflow:auto;align-items:center}
#tabs div{padding:9px 14px;cursor:pointer;color:var(--dim);white-space:nowrap}
#tabs div.on{background:var(--panel2);color:var(--tx);border-bottom:2px solid var(--tx)}
#tabs span{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
#panel{flex:1;overflow:auto;padding:8px 12px;display:flex;gap:12px;align-items:flex-start}
#pv{flex:none;width:150px;height:150px;border:2px solid var(--line);position:relative;background:#8a7a62;display:none}
#pv.map{background:#5b79a6}
#rows{flex:1;min-width:0}
.h{border-left:3px solid var(--acc);padding-left:8px;margin:12px 0 6px;font-weight:600}
.r{display:flex;align-items:center;gap:8px;background:var(--panel);margin-bottom:2px;padding:11px 12px;min-height:42px}
.r>.l{flex:1;min-width:0}
.r.ch{padding-left:28px;background:var(--panel2)}
.r.g{cursor:pointer;background:var(--panel2)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:0 4px}
.o{display:inline-flex;align-items:center;gap:6px;margin-left:14px;cursor:pointer;white-space:nowrap}
.dm{width:14px;height:14px;border:1.5px solid var(--dim);transform:rotate(45deg) scale(.85);display:inline-block}
.o.on .dm{background:var(--teal);border-color:var(--teal)}
.sl{display:inline-flex;align-items:center;gap:6px}
.sl input{width:130px;accent-color:var(--tx)}
.sl b{min-width:34px;text-align:right;font-weight:500}
.sl i{font-style:normal;width:24px;height:24px;line-height:22px;text-align:center;background:var(--btn);color:var(--btnt);cursor:pointer}
.sw{display:inline-flex;gap:8px}
.sw u{width:22px;height:22px;border:2px solid transparent;cursor:pointer;display:inline-block;text-decoration:none}
.sw u.on{outline:2px solid var(--tx);outline-offset:1px}
.n{color:var(--dim);padding:8px 12px;text-align:right}
.tp{display:none;background:var(--panel2);border:1px solid var(--line);padding:6px 8px;margin-top:6px;font-size:12px;font-weight:400;color:var(--dim);white-space:normal}.tp.sh{display:block}.q{cursor:pointer;display:inline-block;width:14px;height:14px;line-height:14px;border-radius:50%;background:var(--dim);color:var(--bg);font-size:10px;text-align:center;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);padding:10px}
.card.on{border-color:var(--tx)}.card small{color:var(--dim)}
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ab div{background:var(--panel);padding:10px;font-size:13px}.ab b{display:block;font-size:15px}.ab em{display:inline-block;border:1px solid var(--dim);padding:0 5px;margin:4px 0;font-size:11px;font-style:normal}
.wl{display:flex;gap:12px;flex-wrap:wrap}.wl>div{flex:1;min-width:220px}
.bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}.bar .p{margin-left:auto}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lk button{font-size:12px}
@media (max-width:640px){#body{flex-direction:column}nav{width:auto;display:flex;border-right:0;border-bottom:1px solid var(--line)}nav div{padding:10px 12px;white-space:nowrap}
#panel{flex-direction:column}.gr{grid-template-columns:1fr}.r{flex-wrap:wrap}.o{margin-left:8px}}
</style>
</head>

.','Got It':'On: when a teammate sends a quick message, tap “Got It” (or the message itself) to reply quickly. Off: no “Got It” button, and tapping a message will not reply.','Praise':'On: when a teammate gets a multi-kill, defuses the Spike, ends an enemy streak or similar highlight, a “Praise” button appears. Off: no Praise button in matches.','Tactical Comms':'On: a Tactical Comms broadcast button appears when the conditions are met. Off: no Tactical Comms button in matches.','Apologize':'On: triggered when you die in a match. Off: no “Apologize” button in matches.','Encourage':'On: when the last surviving teammate is defeated, an “Encourage” button appears. Off: no Encourage button.','Hold Steady':'On: after a losing streak or big score deficit, a “Hold Steady” button appears in the next round’s prep phase. Off: no Hold Steady button.','Coordinate':'On: when you secure a kill in coordination with a teammate, a “Good Teamwork” button appears; tap to praise them. Off: no such button.','Joystick Scheme':'Fixed Joystick: the joystick stays put; tap its relative position to move that way. Left-Half Move: push the joystick from anywhere in the left half of the screen. Follow Finger: moving left/right follows your finger; moving forward/back locks the joystick position.','Upper-Left Area Fire':'The size of this zone can be adjusted in Custom Layout. It only supports weapon fire, not abilities: tap the ability icon to cast, or tap the fire button while holding an ability.','Pure Focus Mode':'On: maximum performance with faster response and a steadier network. Stable frame rate, less heat, simplified graphics detail. Graphics-related settings are hidden.','Frame Rate':'To use High or Ultra frame rate, set your phone’s screen refresh rate to high-refresh mode and keep the system up to date. Higher frame rates are smoother but increase device load.','Spectator Frame Limit':'When on, the maximum frame rate while spectating after death is capped at 60 fps to save battery.','Directional Mic Noise Reduction':'Uses the system’s mic-optimized noise reduction to fix cases where some devices cannot capture the mic.','Allow In-Match Vibration Alerts':'When on, a vibration alert is triggered if the system detects you have been inactive in a match for a long time.','Dual-Button Mode':'When on, the ability’s switch/adjust button is hidden and an extra secondary release button is added.','Release Ability on Press':'Preview caption (off): during the ability’s wind-up, tap and release the ability button to release it immediately.','Ability Button Sensitivity':'Sensitivity adjustment while holding the ability button.','Camera Turn Mode':'Fixed Speed: sensitivity stays constant; the same swipe distance always gives the same rotation, however fast you swipe. Speed Acceleration: sensitivity changes with swipe speed; faster swipes give higher sensitivity and a larger rotation.','Acceleration':'Only takes effect in Speed Acceleration mode. The higher the value, the larger the rotation from fast swipes.','Gyroscope':'When the gyroscope is on, you can control the camera and view direction by tilting your phone.','Vertical (Y-Axis) Sensitivity':'Adjusts the difference between vertical and horizontal sensitivity. The smaller the value, the slower vertical movement is compared with horizontal.','Headhunter Scope':'Headhunter: Chamber’s exclusive ability.','Headhunter (Chamber)':'Headhunter: Chamber’s exclusive ability.'};
